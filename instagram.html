<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        img {
            display: block;
            max-width: 100%;
        }
        a {
            display: block;
            text-align: center;
            padding: 10px;
            background-image: linear-gradient(to right, #FFC200, #FFBB00, #FF9300, #FE6800, #FE4C01, #FF1E26, #FF0F34, #FD017F, #FC00D3, #CA01E8, #8C03FA);
            color: white;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
             background-image: linear-gradient(to right, #ffc4009a, #ffbb00ad, #ff9500bb, #fe6a00b7, #fe4d01af, #ff1e26b4, #ff0f33c4, #fd017fb9, #fc00d2b0, #c901e8b2, #8b03fac2);
        }
    </style>
</head>
<body>
    <img src="imagens/tela-instagram.jpg" alt="Tela do instagram">
    <a href="https://www.instagram.com/gustavoguanabara/" target="_blank">Instagram</a>
</body>
</html>
