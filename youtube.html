<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        img {
            display: block;
            max-width: 100%;
        }
        a {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            background-color: #FF0000;
            color: white;
        }
        a:hover {
            text-decoration: underline;
            background-color: #ff0000de;
        }
    </style>
</head>
<body>
    <img src="imagens/tela-youtube.png" alt="Tela do youtube">
    <a href="https://www.youtube.com/@cursoemvideo" target="_blank">Youtube</a>
</body>
</html>
