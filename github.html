<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        img {
            display: block;
            max-width: 100%;
        }
        a {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: #0D1117;
            color: #F0F6FC;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
            background-color: #1a2029;
        }
    </style>
</head>
<body>
    <img src="imagens/tela-github.jpg" alt="Tela do Github">
    <a href="https://github.com/gustavoguanabara" target="_blank">GitHub</a>
</body>
</html>
